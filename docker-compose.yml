services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD: splitmate
      POSTGRES_DB: splitmate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmate -d splitmate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
